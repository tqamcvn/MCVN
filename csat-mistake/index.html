<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSAT & Mistake · MCVN QA</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1e293b; --muted:#64748b; --line:#e5eaf2;
  --brand:#3b6fe0; --good:#16a34a; --bad:#e0483d; --avg:#e0a63a; --violet:#7c5ce6;
  --shadow:0 1px 3px #0f172a12,0 8px 24px #0f172a08;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--brand)}
header{background:linear-gradient(120deg,#2b4fb0,#3b6fe0);color:#fff;padding:18px 22px}
.head-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
header .sub{opacity:.85;font-size:13px;margin-top:2px}
.spacer{flex:1}
.stamp{font-size:12px;opacity:.9}
button.refresh{background:#fff;color:#2b4fb0;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
button.refresh:disabled{opacity:.6;cursor:default}
main{max-width:1280px;margin:0 auto;padding:18px 22px 60px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters label{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;gap:4px}
.filters select,.filters input{font:14px inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:130px}
.filters .reset{align-self:flex-end;background:#eef2fb;color:#33507f;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--brand)}
.kpi .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.good{border-top-color:var(--good)} .kpi.bad{border-top-color:var(--bad)} .kpi.violet{border-top-color:var(--violet)} .kpi.avg{border-top-color:var(--avg)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:18px}
.panel{background:var(--card);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:14px}
.panel .chartbox{position:relative;height:260px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);cursor:pointer;user-select:none;position:sticky;top:0;background:#fff}
th.num,td.num{text-align:right}
tbody tr:hover{background:#f8faff}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700}
.b-good{background:#e7f7ee;color:#137a3d}.b-mid{background:#fef4e2;color:#9a6a12}.b-bad{background:#fdecea;color:#b0261b}
.bar{height:6px;border-radius:4px;background:#eef2f8;overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle;width:80px}
.bar>span{display:block;height:100%}
.muted{color:var(--muted)}
.state{padding:40px;text-align:center;color:var(--muted)}
.err{background:#fdecea;color:#b0261b;border:1px solid #f4b9b3;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.pill{font-size:12px;color:var(--muted)}
@media(max-width:640px){.kpi .v{font-size:22px}}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <h1>CSAT &amp; Mistake Dashboard</h1>
      <div class="sub">MCVN QA · dữ liệu tự cập nhật từ Google Sheet</div>
    </div>
    <div class="spacer"></div>
    <div style="text-align:right">
      <div class="stamp" id="stamp">Đang tải…</div>
      <button class="refresh" id="refreshBtn" onclick="loadData(true)">↻ Cập nhật ngay</button>
    </div>
  </div>
</header>

<main>
  <div id="errBox"></div>
  <div class="filters" id="filters" hidden>
    <label>Tháng<select id="f_month"><option value="">Tất cả</option></select></label>
    <label>Tuần<select id="f_week"><option value="">Tất cả</option></select></label>
    <label>Team<select id="f_team"><option value="">Tất cả</option></select></label>
    <label>Channel<select id="f_channel"><option value="">Tất cả</option></select></label>
    <label>Seniority<select id="f_sen"><option value="">Tất cả</option></select></label>
    <label>Premium<select id="f_prem"><option value="">Tất cả</option></select></label>
    <label>User<select id="f_user"><option value="">Tất cả</option></select></label>
    <label style="flex:1;min-width:180px">Tìm CS<input id="f_q" type="search" placeholder="Tên hoặc email CS"></label>
    <button class="reset" onclick="resetFilters()">Xoá lọc</button>
  </div>

  <div id="content" class="state">Đang tải dữ liệu…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const DATA_URL="data.json";
let DB={csat:[],mistake:[]}, charts={};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uniq=(a,k)=>[...new Set(a.map(x=>x[k]).filter(v=>v!==''&&v!=null))].sort((x,y)=>String(x).localeCompare(String(y),'vi',{numeric:true}));
const pct=(n,d)=>d>0?(n/d*100):null;
const fpct=v=>v==null?'—':v.toFixed(1)+'%';

async function loadData(force){
  const btn=$('refreshBtn'); btn.disabled=true; if(force)$('stamp').textContent='Đang cập nhật…';
  try{
    const res=await fetch(DATA_URL+"?t="+Date.now());
    if(!res.ok) throw new Error("HTTP "+res.status);
    DB=await res.json();
    $('errBox').innerHTML='';
    $('stamp').textContent="Cập nhật lúc: "+(DB.lastUpdatedText||'—');
    $('filters').hidden=false;
    buildFilterOptions();
    render();
  }catch(e){
    $('errBox').innerHTML='<div class="err">Không tải được data.json ('+esc(e.message)+'). Nếu là lần đầu: chạy <b>setup</b> trong Apps Script rồi chờ Pages build ~1–3 phút.</div>';
    $('content').innerHTML='';
  }finally{ btn.disabled=false; }
}

function buildFilterOptions(){
  const c=DB.csat||[];
  fill('f_month',uniq(c,'m')); fill('f_week',uniq(c,'w')); fill('f_team',uniq(c,'team'));
  fill('f_channel',uniq(c,'ch')); fill('f_sen',uniq(c,'sen')); fill('f_prem',uniq(c,'prem')); fill('f_user',uniq(c,'ut'));
  ['f_month','f_week','f_team','f_channel','f_sen','f_prem','f_user'].forEach(id=>$(id).onchange=render);
  $('f_q').oninput=()=>{clearTimeout(window._qt);window._qt=setTimeout(render,200);};
}
function fill(id,vals){const s=$(id);const cur=s.value;s.innerHTML='<option value="">Tất cả</option>'+vals.map(v=>`<option>${esc(v)}</option>`).join('');s.value=cur;}
function resetFilters(){['f_month','f_week','f_team','f_channel','f_sen','f_prem','f_user'].forEach(id=>$(id).value='');$('f_q').value='';render();}

function filtered(){
  const m=$('f_month').value,w=$('f_week').value,t=$('f_team').value,ch=$('f_channel').value,se=$('f_sen').value,pr=$('f_prem').value,ut=$('f_user').value,q=$('f_q').value.trim().toLowerCase();
  const okC=r=>(!m||r.m===m)&&(!w||r.w===w)&&(!t||r.team===t)&&(!ch||r.ch===ch)&&(!se||r.sen===se)&&(!pr||r.prem===pr)&&(!ut||r.ut===ut)&&(!q||(r.name+' '+r.email).toLowerCase().includes(q));
  // Mistake sheet không có channel/premium/user -> chỉ lọc theo month/week/team/seniority/search
  const okM=r=>(!m||r.m===m)&&(!w||r.w===w)&&(!t||r.team===t)&&(!se||r.sen===se)&&(!q||(r.name+' '+r.email).toLowerCase().includes(q));
  return {csat:(DB.csat||[]).filter(okC), mistake:(DB.mistake||[]).filter(okM)};
}

let sortKey='csatPct',sortDir=1;
function render(){
  const {csat,mistake}=filtered();
  const good=sum(csat,'good'),bad=sum(csat,'bad'),avg=sum(csat,'avg'),cases=sum(csat,'cases'),contacts=sum(csat,'contacts');
  const csatPct=pct(good,good+bad);
  const agents=new Set(csat.map(r=>r.email));
  const mistakeN=mistake.length;
  const mistakeRate=pct(mistakeN,contacts||cases);

  $('content').innerHTML=`
    <div class="kpis">
      ${kpi('Tổng case',fmtN(cases),contacts?fmtN(contacts)+' contacts':'','')}
      ${kpi('CSAT %',fpct(csatPct),good+bad+' good+bad','good')}
      ${kpi('Good / Avg / Bad',fmtN(good)+' / '+fmtN(avg)+' / '+fmtN(bad),'','avg')}
      ${kpi('Tổng mistake',fmtN(mistakeN),mistakeRate!=null?fpct(mistakeRate)+' / contact':'','bad')}
      ${kpi('Số CS',fmtN(agents.size),'trong bộ lọc','violet')}
    </div>
    <div class="grid2">
      <div class="panel"><h3>CSAT % theo tuần</h3><div class="chartbox"><canvas id="cWeek"></canvas></div></div>
      <div class="panel"><h3>CSAT % theo team</h3><div class="chartbox"><canvas id="cTeam"></canvas></div></div>
      <div class="panel"><h3>Mistake theo lý do (top 10)</h3><div class="chartbox"><canvas id="cReason"></canvas></div></div>
      <div class="panel"><h3>Mistake theo team</h3><div class="chartbox"><canvas id="cMteam"></canvas></div></div>
    </div>
    <div class="panel" style="margin-bottom:18px">
      <h3>Chi tiết theo CS <span class="pill">(bấm tiêu đề để sắp xếp)</span></h3>
      <div class="tablewrap" id="agentTable"></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Top issue (Agent Mistake)</h3><div class="tablewrap" id="issueTable"></div></div>
      <div class="panel"><h3>Mistake theo QA PIC</h3><div class="tablewrap" id="qaTable"></div></div>
    </div>`;

  drawWeek(csat); drawTeam(csat); drawReason(mistake); drawMteam(mistake);
  drawAgentTable(csat,mistake); drawIssueTable(mistake); drawQaTable(mistake);
}

function kpi(l,v,s,cls){return `<div class="kpi ${cls||''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||'&nbsp;'}</div></div>`;}
function sum(a,k){return a.reduce((s,x)=>s+(+x[k]||0),0);}
function fmtN(n){return (n||0).toLocaleString('vi-VN');}
function groupSum(a,key,fields){const m=new Map();a.forEach(r=>{const g=r[key]||'—';let o=m.get(g);if(!o){o={};fields.forEach(f=>o[f]=0);m.set(g,o);}fields.forEach(f=>o[f]+=(+r[f]||0));});return m;}
function countBy(a,key){const m=new Map();a.forEach(r=>{const g=(r[key]||'—');m.set(g,(m.get(g)||0)+1);});return m;}

function mkChart(id,cfg){if(charts[id])charts[id].destroy();const el=$(id);if(!el||!window.Chart)return;charts[id]=new Chart(el,cfg);}
const PAL=['#3b6fe0','#16a34a','#e0a63a','#e0483d','#7c5ce6','#0ea5b7','#e8590c','#8b5cf6','#0891b2','#65a30d'];

function drawWeek(csat){
  const g=groupSum(csat,'w',['good','bad']); const ks=[...g.keys()].sort((a,b)=>String(a).localeCompare(String(b)));
  const data=ks.map(k=>{const o=g.get(k);return pct(o.good,o.good+o.bad);});
  mkChart('cWeek',{type:'line',data:{labels:ks,datasets:[{label:'CSAT %',data,borderColor:'#3b6fe0',backgroundColor:'#3b6fe022',fill:true,tension:.3,spanGaps:true}]},options:lineOpts()});
}
function drawTeam(csat){
  const g=groupSum(csat,'team',['good','bad']); const ks=[...g.keys()];
  const data=ks.map(k=>{const o=g.get(k);return pct(o.good,o.good+o.bad);});
  mkChart('cTeam',{type:'bar',data:{labels:ks,datasets:[{label:'CSAT %',data,backgroundColor:'#16a34a'}]},options:barOpts()});
}
function drawReason(mistake){
  const c=[...countBy(mistake,'reason').entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
  mkChart('cReason',{type:'bar',data:{labels:c.map(x=>x[0]),datasets:[{label:'Số mistake',data:c.map(x=>x[1]),backgroundColor:'#e0483d'}]},options:barOpts(true)});
}
function drawMteam(mistake){
  const c=[...countBy(mistake,'team').entries()].sort((a,b)=>b[1]-a[1]);
  mkChart('cMteam',{type:'bar',data:{labels:c.map(x=>x[0]),datasets:[{label:'Số mistake',data:c.map(x=>x[1]),backgroundColor:'#7c5ce6'}]},options:barOpts()});
}
function lineOpts(){return {responsive:true,maintainAspectRatio:false,scales:{y:{ticks:{callback:v=>v+'%'},suggestedMax:100}},plugins:{legend:{display:false}}};}
function barOpts(horizontal){return {responsive:true,maintainAspectRatio:false,indexAxis:horizontal?'y':'x',plugins:{legend:{display:false}},scales:{}};}

function drawAgentTable(csat,mistake){
  const g=new Map();
  csat.forEach(r=>{let o=g.get(r.email);if(!o){o={email:r.email,name:r.name,team:r.team,ch:new Set(),grade:r.grade,cases:0,good:0,bad:0,avg:0,mistakes:0};g.set(r.email,o);}o.cases+=+r.cases||0;o.good+=+r.good||0;o.bad+=+r.bad||0;o.avg+=+r.avg||0;if(r.ch)o.ch.add(r.ch);if(r.grade)o.grade=r.grade;});
  const mc=countBy(mistake,'email');
  const rows=[...g.values()].map(o=>{o.mistakes=mc.get(o.email)||0;o.csatPct=pct(o.good,o.good+o.bad);o.channels=[...o.ch].join(', ');return o;});
  rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(typeof x==='string'){x=x||'';y=y||'';return sortDir*x.localeCompare(y,'vi');}return sortDir*(( x==null?-1:x)-(y==null?-1:y));});
  const cols=[['name','CS',0],['team','Team',0],['channels','Channel',0],['cases','Case',1],['good','Good',1],['bad','Bad',1],['csatPct','CSAT %',1],['mistakes','Mistake',1],['grade','Grade',0]];
  const maxM=Math.max(1,...rows.map(r=>r.mistakes));
  let h='<table><thead><tr>'+cols.map(c=>`<th class="${c[2]?'num':''}" onclick="setSort('${c[0]}')">${c[1]}${sortKey===c[0]?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>`<tr>
    <td>${esc(r.name||r.email)}<div class="muted" style="font-size:11px">${esc(r.email)}</div></td>
    <td>${esc(r.team)}</td><td class="muted">${esc(r.channels)}</td>
    <td class="num">${fmtN(r.cases)}</td><td class="num">${fmtN(r.good)}</td><td class="num">${fmtN(r.bad)}</td>
    <td class="num">${csatBadge(r.csatPct)}</td>
    <td class="num">${r.mistakes?`<span class="bar"><span style="width:${r.mistakes/maxM*100}%;background:#e0483d"></span></span> ${r.mistakes}`:'0'}</td>
    <td>${esc(r.grade||'—')}</td></tr>`).join('')||'<tr><td colspan="9" class="muted" style="text-align:center">Không có dữ liệu.</td></tr>';
  h+='</tbody></table>';
  $('agentTable').innerHTML=h;
}
function csatBadge(v){if(v==null)return '<span class="muted">—</span>';const cls=v>=90?'b-good':v>=80?'b-mid':'b-bad';return `<span class="badge ${cls}">${v.toFixed(1)}%</span>`;}
function setSort(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==='name'||k==='team'||k==='grade')?1:-1;}render();}

function drawIssueTable(mistake){
  const c=[...countBy(mistake,'issue').entries()].sort((a,b)=>b[1]-a[1]).slice(0,15);
  const tot=mistake.length||1;
  $('issueTable').innerHTML='<table><thead><tr><th>Issue</th><th class="num">Số</th><th class="num">%</th></tr></thead><tbody>'+
    (c.map(x=>`<tr><td>${esc(x[0])}</td><td class="num">${x[1]}</td><td class="num">${(x[1]/tot*100).toFixed(1)}%</td></tr>`).join('')||'<tr><td colspan="3" class="muted" style="text-align:center">—</td></tr>')+'</tbody></table>';
}
function drawQaTable(mistake){
  const c=[...countBy(mistake,'qa').entries()].sort((a,b)=>b[1]-a[1]);
  $('qaTable').innerHTML='<table><thead><tr><th>QA PIC</th><th class="num">Số tag</th></tr></thead><tbody>'+
    (c.map(x=>`<tr><td>${esc(x[0])}</td><td class="num">${x[1]}</td></tr>`).join('')||'<tr><td colspan="2" class="muted" style="text-align:center">—</td></tr>')+'</tbody></table>';
}

loadData(false);
</script>
</body>
</html>
