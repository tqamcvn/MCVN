name: Recap bot
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only check, do not write
        type: boolean
        default: true
  repository_dispatch:
    types: [recap]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: recap-sheet-writer
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || vars.RECAP_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: recap-bot
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python bot.py
