name: Build MCVN with My Space
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-space-app/package-lock.json
      - run: npm ci
        working-directory: my-space-app
      - run: npm test && npm run typecheck && npm run lint
        working-directory: my-space-app
      - run: npm run package:site
        working-directory: my-space-app
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete static site
        id: deployment
        uses: actions/deploy-pages@v4
